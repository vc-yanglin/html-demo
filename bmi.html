<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>BMI計算機</title>

    <style>
        form {
            width: 40%;
            background-color: coral;
            margin: 24px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 12px 12px 5px rgb(196, 186, 186);
        }

        input {
            margin: 6px 0px;
            font-size: 20px;
            border-radius: 6px;
        }

        label {
            margin: 6px 0px;
            font-size: 20px;
        }

        button {
            margin-top: 1rem;
            width: 120px;
            height: 35px;
            background-color: aqua;
            border: none;
            font-size: 16px;
            border-radius: 6px;
            color: white;
        }

        button:hover {
            background-color: blue;
            cursor: pointer;
        }

        a {
            background-color: brown;
            color: white;
            padding: 12px;
            border-radius: 6px;
        }

        a:hover {
            background-color: blue;
            cursor: pointer;
        }

        @media screen and (max-width:600px) {

            form {
                width: 80%;
            }

        }
    </style>

</head>

<body>
    <div class="title">BMI計算機</div>
    <form action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名"><br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" placeholder="18"><br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1"><br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1"><br>

        <div style="font-size: 20px;background-color: aqua;margin: 6px 0px;padding: 6px;">
            <input type="radio" name="sex" id="male" checked>男
            <input type="radio" name="sex" id="female"> 女

            <label for="county">居住縣市</label>
            <select name="county" id="county">
                <option value="台北市">台北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="台中市">台中市</option>
                <option value="台南市">台南市</option>
                <option value="高雄市">高雄市</option>
            </select>
        </div>
        <button type="submit">計算</button>

    </form>
    <a href="index.html">首頁</a>


</body>

</html>
